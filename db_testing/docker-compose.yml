version: "3.9"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: test
      CLICKHOUSE_PASSWORD: test
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

  vertica:
    image: opentext/vertica-k8s:25.3.0-4-minimal
    container_name: vertica
    ports:
      - "5433:5433"
    volumes:
      - vertica_data:/data
    environment:
      VERTICA_DB_NAME: analytics
      VERTICA_DB_USER: dbadmin
      VERTICA_DB_PASSWORD: dbadmin
    shm_size: 1g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  clickhouse_data:
  vertica_data:
  kafka_data:
