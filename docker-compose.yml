version: "3.9"

services:
  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    hostname: kafka
    expose:
      - "9092"
    networks:
      - app-network
    env_file:
      - kafka.env
    healthcheck:
      test: /kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server kafka:9092 || exit 1
      interval: 1s
      timeout: 60s
      retries: 60

  ingest-api:
    build:
      context: ./ingest_api
    container_name: ingest-api
    expose:
      - "8005"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./ingest_api:/opt/app
    networks:
      - app-network
    depends_on:
      - kafka
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    container_name: clickhouse
    expose:
      - "8123"
      - "9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - app-network
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: test
      CLICKHOUSE_PASSWORD: test
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1


  etl_worker:
    build:
      context: ./etl
    container_name: analytics-etl-worker
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    volumes:
      - ./etl:/opt/app
    networks:
      - app-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.29.4-alpine
    container_name: analytics-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  clickhouse_data:
  kafka_data:

networks:
  app-network:
    driver: bridge